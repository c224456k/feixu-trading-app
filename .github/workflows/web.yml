name: Deploy Web (GitHub Pages)

# 網頁版（PWA）：玩家用 Safari / Chrome 開網址，iPhone 可以「加入主畫面」當 App 用。
# 編譯一律交給 GitHub 雲端做（本機記憶體不夠），結果發佈到 GitHub Pages：
#   https://c224456k.github.io/feixu-trading-app/
#
# - 任何分支 push 都會編譯一次（確認編得過），但只有 main 才會真的部署
# - 跟 build.yml（Android / Windows）完全獨立，互不影響

on:
  push:
    branches: [main, web-pwa]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      # --base-href 要跟 Pages 網址的路徑（/repo 名稱/）一致，不然會找不到 js / 資源檔
      # APP_BUILD = 部署流水號-commit 前 7 碼，顯示在畫面底下，也寫進 build_info.json 讓舊版頁面偵測到有新版
      - name: 編譯網頁版
        run: flutter build web --release --base-href /feixu-trading-app/ --dart-define=APP_BUILD=${{ github.run_number }}-${GITHUB_SHA::7}
      - name: 產生版本資訊檔（給前端偵測新版用）
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          msg = (os.environ.get("COMMIT_MSG") or "").strip().splitlines()
          sha = os.environ["GITHUB_SHA"][:7]
          build = os.environ["RUN_NUMBER"] + "-" + sha
          json.dump({"build": build, "notes": msg[0] if msg else ""}, open("build/web/build_info.json", "w"), ensure_ascii=False)
          PY
          cat build/web/build_info.json
      # 在程式檔網址後面加上這次提交的版本參數：GitHub Pages 預設讓瀏覽器快取檔案 10 分鐘，
      # 而且「加入主畫面」的網頁版常常更久，沒有這個參數玩家會一直看到舊版畫面。
      # 有版本參數，每次部署後只要重新開啟網頁就一定載入新的程式檔。
      - name: 加上版本參數避免舊快取
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=$V\"#" build/web/flutter_bootstrap.js
          sed -i "s#src=\"flutter_bootstrap.js\"#src=\"flutter_bootstrap.js?v=$V\"#" build/web/index.html
          grep -q "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$V" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
