name: Build Feixu App

# 這支 workflow 的重點：本機那台機器記憶體很緊，實際的編譯工作
# （Android APK 用 Gradle、Windows 用 MSVC）全部交給 GitHub 的雲端主機做，
# 不佔用本機任何資源。編好的檔案會出現在這次 workflow run 的 Artifacts 裡，直接下載。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      # 用固定的簽章金鑰簽 release 版，這樣玩家每次更新才會是「覆蓋安裝」而不是
      # 「先移除舊版才能裝」，不然每次更新都會把 App 本機資料（登入 token）清光。
      - name: 還原正式簽章金鑰
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/release-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: feixu-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    # 之前用 windows-latest + 舊版 flutter 時，flutter 內部會去抓 "Visual Studio 16 2019"
    # 當產生器字串（不吃 CMAKE_GENERATOR 環境變數，是它自己內部硬寫的 -G 參數），
    # 但 runner 上其實裝的是 VS2022，找不到就直接建置失敗。
    # 改成不釘版本（讓它抓最新的 stable flutter，指令偵測邏輯可能已經修過），
    # 並且把 runner 明確釘在 windows-2022（不用 windows-latest，避免未來 runner 換了更新的
    # image 又出現同樣的版本偵測落差）。
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: feixu-windows
          path: build/windows/x64/runner/Release/
